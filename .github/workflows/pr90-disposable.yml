name: Release disposable Moodle acceptance
on:
  pull_request:
    branches: [main]
    paths: ['local/kbacompany/**', 'tools/acceptance/**', '.github/workflows/pr90-disposable.yml', 'tools/build_install.py']
permissions:
  contents: read
jobs:
  package:
    # Release rehearsal is separate from the existing risk-selected merge checks.
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build immutable install artifact once
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/acceptance/pr90/package.py '${{ runner.temp }}/release-package'
      - uses: actions/upload-artifact@v4
        with:
          name: release-install-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          retention-days: 30
  rehearsal:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine:
          - {type: mariadb, image: 'mariadb:10.11.19@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae'}
          - {type: mysqli, image: 'percona/percona-server:8.0.46-37@sha256:a4ba7d1afd325f40bc6d65b6455fb4f15388638dfa39e3b85f9755755fd9ec2d'}
    services:
      database:
        image: ${{ matrix.engine.image }}
        env: {MYSQL_ROOT_PASSWORD: isolated-ci-only, MYSQL_ROOT_HOST: '%'}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pisolated-ci-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with: {path: candidate, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: moodle/moodle, ref: b27f0816159a7555a0b3ad9ff2f8f8ef701a29fa, path: moodle-core, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, intl, zip, gd, soap, mbstring, curl, sodium
          ini-values: max_input_vars=5000, memory_limit=1024M
          coverage: none
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: release-install-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-package
      - run: |
          python -m pip install --quiet playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Install package and rehearse complete synthetic restore
        env:
          MOODLE_ROOT: ${{ github.workspace }}/moodle-core
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          TEST_ROOT: ${{ runner.temp }}/pr90
          DBTYPE: ${{ matrix.engine.type }}
          DBHOST: 127.0.0.1
          DBPORT: '3306'
          DBUSER: root
          DBPASS: isolated-ci-only
          PACKAGE_ROOT: ${{ runner.temp }}/release-package
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python candidate/tools/acceptance/pr90/rehearsal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr90-rehearsal-${{ matrix.engine.type }}
          path: |
            ${{ runner.temp }}/pr90/public/
          if-no-files-found: error
          retention-days: 14
