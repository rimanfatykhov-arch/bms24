name: BMS24 Dev AI checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bms24-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none
          coverage: none
      - name: CI workflow policy (PR artifact before merge)
        run: |
          python tools/check_workflow_policy.py
          python tools/test_workflow_policy_1878.py
      - name: Agent policy and packaging tests
        run: |
          python tools/dev_ai_gate.py
          python tools/test_dev_ai_tools.py
          python tools/test_dev_ai_cycle.py
          python tools/test_ci_artifact.py
          python tools/test_github_import_1877.py
          python tools/dev_ai_cycle.py validate --task dev_ai/templates/task.example.json
      - name: Moodle static checks
        run: |
          python local/kbacompany/cli/check_upgrade_sequence.py
          python local/kbacompany/cli/check_xmldb_schema_names.py
          python local/kbacompany/cli/check_php81_compat.py
          python local/kbacompany/cli/check_rc29_regression_gate.py
          python local/kbacompany/cli/test_rc30_offline_1871.py
      - name: Workspace Battle Plan date hotfix regression
        run: python tools/test_battleplan_date_1875.py
      - name: Machine-date ISO regression (week, dates, calendar)
        run: python tools/test_business_dates_1876.py
      - name: PHP 8.1 syntax
        run: find local/kbacompany -name '*.php' -type f -print0 | xargs -0 -n1 -P8 php -l > /tmp/bms-php-lint.txt
      - name: JavaScript syntax
        run: find local/kbacompany -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Shell syntax (Timeweb host inspection)
        run: bash -n infra/timeweb/staging-preflight.sh
      - name: Build and verify deterministic candidate
        run: |
          mkdir -p artifacts
          python tools/build_install.py --output artifacts/INSTALL_local_kbacompany_1.1.0-rc29_build2026110503.zip --manifest artifacts/MANIFEST_build2026110503.json
          python tools/build_install.py --output artifacts/repeat.zip
          cmp artifacts/INSTALL_local_kbacompany_1.1.0-rc29_build2026110503.zip artifacts/repeat.zip
          python tools/verify_install.py --zip artifacts/INSTALL_local_kbacompany_1.1.0-rc29_build2026110503.zip --manifest artifacts/MANIFEST_build2026110503.json --expected-version 2026110503
          sha256sum artifacts/INSTALL_local_kbacompany_1.1.0-rc29_build2026110503.zip > artifacts/SHA256SUMS.txt
          rm artifacts/repeat.zip
      # Reviewed PRs must get an installable candidate BEFORE merge.
      # Artifacts are UNAPPROVED; no deploy job or credentials in CI.
      - name: Upload candidate artifact (PR and main)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: bms24-candidate-${{ github.event.pull_request.number || github.sha }}-build2026110503
          path: |
            artifacts/INSTALL_local_kbacompany_1.1.0-rc29_build2026110503.zip
            artifacts/MANIFEST_build2026110503.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
