name: BMS24 V1h disposable database crash rehearsal
on:
  pull_request:
    paths:
      - 'tools/release_operator/mysql_fault_rehearsal.py'
      - 'tools/release_operator/test_mysql_fault_rehearsal.py'
      - '.github/workflows/bms-operator-disposable-db-fault.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  disposable-db-fault:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: Percona 8.0
            image: percona/percona-server:8.0.46-37@sha256:a4ba7d1afd325f40bc6d65b6455fb4f15388638dfa39e3b85f9755755fd9ec2d
          - name: MariaDB 10.11
            image: mariadb:10.11.19@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae
    name: Real synthetic SQL dump/restore + SIGKILL / ${{ matrix.database.name }}
    services:
      mysql:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pisolated-ci-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      BMS_FAULT_REHEARSAL: '1'
      DBHOST: 127.0.0.1
      DBPORT: '3306'
      DBUSER: root
      DBPASS: isolated-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local SQL client (isolated CI only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          test -x /usr/bin/mysql
          test -x /usr/bin/mysqldump
      - name: Fail-closed safety policy tests
        run: python -m unittest discover -s tools/release_operator -p 'test_mysql_fault_rehearsal.py' -v
      - name: Real DB crash/restore simulation (never Moodle or production)
        run: |
          python tools/release_operator/mysql_fault_rehearsal.py
