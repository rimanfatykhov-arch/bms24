<title>Коммуникационный центр BMS24 — прототип</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: BMS24 owned shell (navy menu) + center: section bar, conversation list, conversation, slide-in context drawer.
   Single deliberate light look = the real BMS24 product palette (docs/17, bms_ui/tokens.css). */
:root {
  --navy: #0B2B41; --navy-800: #163A50; --emerald: #0C6C52; --emerald-hover: #095741; --blue: #1777B5;
  --violet: #6B43B5; --sky: #E4F2FB; --mint: #ECF7F3; --sand: #FDF6ED; --white: #FFFFFF;
  --text: #1D2937; --muted: #526673; --border: #D9E5E9; --line: #E8F0F3; --warning: #B15F00; --danger: #BC3030;
  --danger-bg: #FBEDED; --warn-bg: #FFF4E5; --hover: #F3F8FA; --selected: #E6F3EE;
  --font: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --r-card: 14px; --r-ctl: 9px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--text); font: 14px/1.45 var(--font); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- prototype control bar (not product UI) ---------- */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: #2B1F3A; color: #fff;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: #2B1F3A; }
.proto b.tag { background: #FFD24D; color: #2B1F3A; border-radius: 6px; padding: 2px 8px; letter-spacing: .04em; }
.proto label { display: inline-flex; gap: 6px; align-items: center; }
.proto select { background: #fff; color: #1D2937; border: 0; border-radius: 6px; padding: 4px 6px; max-width: 100%; }
.proto .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.proto .seg button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 3px 9px; }
.proto .seg button[aria-pressed="true"] { background: #fff; color: #2B1F3A; border-color: #fff; }
.proto .note { opacity: .85; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100% - 46px); }
.menu { background: var(--navy); color: #DCE8EF; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { font-weight: 800; font-size: 22px; color: #fff; letter-spacing: .01em; padding: 0 8px 12px; }
.brand small { display: block; font-size: 11px; font-weight: 600; color: #9FB8C7; letter-spacing: 0; }
.menu .grp { margin: 12px 8px 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #9FB8C7; text-transform: uppercase; }
.menu a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: inherit; text-decoration: none;
  /* Fix: wrap between words only; never break inside a word. */
  overflow-wrap: break-word; word-break: normal; hyphens: manual; }
.menu a span.lbl { min-width: 0; flex: 1; }
.menu a.on { background: var(--emerald); color: #fff; font-weight: 600; }
.menu a .cnt { background: #fff; color: var(--navy); border-radius: 999px; font-size: 12px; font-weight: 700; padding: 0 7px; min-width: 22px; text-align: center; }
.main { min-width: 0; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.crumbs { color: var(--muted); font-size: 13px; }

/* ---------- center ---------- */
.center { background: var(--white); border: 1px solid var(--border); border-radius: var(--r-card); display: grid;
  grid-template-columns: 340px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
  height: min(780px, calc(100vh - 150px)); min-height: 540px; overflow: hidden; position: relative; }
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.top h1 { margin-right: auto; }
.top .sections { flex: 0 1 auto; display: flex; overflow-x: auto; scrollbar-width: none; }
.top .sections button { white-space: nowrap; padding: 6px 12px; }
.center.notif { grid-template-columns: minmax(0, 1fr); }
.center.notif .nwrap { min-height: 0; }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 18px; }
h2 { font-size: 16px; }
.sections { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--hover); border-radius: 10px; padding: 3px; }
.sections button { border: 0; background: transparent; border-radius: 8px; padding: 6px 4px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; justify-content: center; align-items: center; min-width: 0; }
.sections button[aria-selected="true"] { background: var(--white); color: var(--text); box-shadow: 0 1px 2px rgba(11,43,65,.12); }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--emerald); color: #fff; font-size: 12px; font-weight: 700; text-align: center; line-height: 20px; }
.badge.blue { background: var(--blue); }
.badge.soft { background: var(--line); color: var(--muted); }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 0 10px; background: var(--white); }
.search input { border: 0; outline: 0; padding: 8px 0; width: 100%; min-width: 0; background: transparent; }
.search:focus-within { outline: 3px solid var(--blue); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border); background: var(--white); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--selected); border-color: var(--emerald); color: var(--emerald); font-weight: 600; }
.btn { border: 1px solid var(--border); background: var(--white); border-radius: var(--r-ctl); padding: 7px 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--emerald); border-color: var(--emerald); color: #fff; }
.btn.primary:hover { background: var(--emerald-hover); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.danger { color: var(--danger); border-color: #EBC5C5; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.icon { width: 18px; height: 18px; flex: none; }

.list { overflow-y: auto; min-height: 0; flex: 1; }
.item { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--white); padding: 10px 14px; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.item:hover { background: var(--hover); }
.item[aria-current="true"] { background: var(--selected); box-shadow: inset 3px 0 0 var(--emerald); }
.ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: var(--navy-800); }
.ava.obj { border-radius: 10px; background: var(--blue); }
.ava.grp { background: var(--emerald); }
.ava.ai { background: var(--violet); }
.item .t, .item .k, .item .p { display: block; }
a.btn { color: var(--text); text-decoration: none; }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .k { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .p { font-size: 13px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.item.unread .t, .item.unread .p { color: var(--text); }
.item .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.at { color: var(--blue); font-weight: 800; }

/* conversation */
.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.conv-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.conv-head .ttl { min-width: 0; flex: 1 1 260px; }
.conv-head .ttl h2 { overflow-wrap: anywhere; }
.kind { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; background: var(--sky); color: #155F91; }
.pill.mint { background: var(--mint); color: var(--emerald); }
.pill.sand { background: var(--sand); color: var(--warning); }
.pill.violet { background: #EFE9F8; color: var(--violet); }
.back { display: none; }
.feed { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: #FAFCFD; }
.day { align-self: center; font-size: 12px; color: var(--muted); background: var(--white); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.newline { display: flex; align-items: center; gap: 8px; color: var(--blue); font-size: 12px; font-weight: 700; }
.newline::before, .newline::after { content: ""; flex: 1; height: 1px; background: var(--blue); opacity: .4; }
.msg { max-width: min(640px, 88%); background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
.msg.own { align-self: flex-end; background: #EEF7F2; border-color: #D3EBDD; }
.msg .who { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.msg .who b { color: var(--navy); }
.msg .who .tm { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .mention { color: var(--blue); font-weight: 600; background: var(--sky); border-radius: 4px; padding: 0 3px; }
.msg.mentioned { box-shadow: inset 3px 0 0 var(--blue); }
.quote { border-left: 3px solid var(--blue); background: var(--sky); border-radius: 6px; padding: 4px 8px; font-size: 13px; color: var(--muted); }
.quote b { color: var(--text); display: block; font-size: 12px; }
.files { display: flex; flex-direction: column; gap: 4px; }
.file { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--white); text-decoration: none; color: var(--text); font-size: 13px; }
.file .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .sz { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.msg .acts { display: flex; gap: 4px; flex-wrap: wrap; }
.msg .acts button { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 2px 6px; border-radius: 6px; }
.msg .acts button:hover { background: var(--hover); color: var(--text); }
.msg .state { font-size: 12px; color: var(--muted); }
.msg .state.err { color: var(--danger); font-weight: 600; }
.msg.withdrawn .body { color: var(--muted); font-style: italic; }
.confirm { border: 1px solid #EBC5C5; background: var(--danger-bg); border-radius: 8px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.event { align-self: center; display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--muted); padding: 2px 10px; max-width: 92%; }
.event .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.event b { color: var(--text); font-weight: 600; }
.chan { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 5px; background: #E7F1FA; color: var(--blue); }
.chan.ai { background: #EFE9F8; color: var(--violet); }
.future { border: 1px dashed var(--violet); border-radius: 10px; padding: 6px 10px; color: var(--violet); background: #F7F3FD; font-size: 12px; }

.compose { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--white); }
.compose textarea { width: 100%; min-height: 44px; max-height: 160px; resize: vertical; border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 8px 10px; }
.compose .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.compose .bar .grow { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
.pending-files { display: flex; flex-wrap: wrap; gap: 6px; }
.pf { display: inline-flex; gap: 6px; align-items: center; max-width: 100%; border: 1px solid var(--border); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; }
.pf span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.pf button { border: 0; background: var(--hover); border-radius: 50%; width: 22px; height: 22px; line-height: 1; }
.replying { display: flex; gap: 8px; align-items: center; }
.replying .quote { flex: 1; min-width: 0; }
.alert { border-radius: 10px; padding: 8px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.alert.err { background: var(--danger-bg); color: var(--danger); border: 1px solid #EBC5C5; }
.alert.info { background: var(--sky); color: var(--navy); border: 1px solid #C9E1F1; }
.alert.warn { background: var(--warn-bg); color: var(--warning); border: 1px solid #F1D8B5; }

/* drawer: context and participants on demand, never an empty permanent column */
.scrim { position: absolute; inset: 0; background: rgba(11,43,65,.25); z-index: 5; }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(360px, 100%); background: var(--white); border-left: 1px solid var(--border); z-index: 6; display: flex; flex-direction: column; box-shadow: -12px 0 24px rgba(11,43,65,.12); }
.drawer header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.drawer .body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.people { display: flex; flex-direction: column; gap: 6px; }
.person { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.person .ava { width: 30px; height: 30px; font-size: 11px; }
.person small { color: var(--muted); }

/* empty / loading states */
.empty { margin: auto; text-align: center; max-width: 360px; padding: 24px; display: flex; flex-direction: column; gap: 8px; align-items: center; color: var(--muted); }
.empty h3 { color: var(--text); font-size: 16px; }
.skel { height: 54px; margin: 8px 14px; border-radius: 10px; background: linear-gradient(90deg, var(--line), #F6FAFB, var(--line)); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }

/* notifications */
.nwrap { display: flex; flex-direction: column; min-height: 0; }
.ntools { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.nlist { overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 4px; }
.nday { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 4px; }
.notif-row { display: grid; grid-template-columns: 10px 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; }
.notif-row:hover { background: var(--hover); }
.notif-row .ud { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
.notif-row.read .ud { background: transparent; }
.notif-row .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--sky); color: var(--blue); }
.notif-row .ic.mint { background: var(--mint); color: var(--emerald); }
.notif-row .ic.sand { background: var(--sand); color: var(--warning); }
.notif-row .tx { min-width: 0; }
.notif-row .tx .h { font-weight: 600; overflow-wrap: anywhere; }
.notif-row.read .tx .h { font-weight: 500; color: var(--muted); }
.notif-row .tx .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.notif-row .tx a { color: var(--blue); font-weight: 600; text-decoration: none; }
.notif-row .rt { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; justify-content: flex-end; }
.state-read { color: var(--muted); font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
.collapse { border: 1px dashed var(--border); border-radius: 10px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.proposal { font-size: 11px; font-weight: 700; color: var(--warning); background: var(--warn-bg); border-radius: 4px; padding: 0 5px; }

/* modal: new conversation */
.modal { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(11,43,65,.3); padding: 16px; }
.dialog { background: var(--white); border-radius: var(--r-card); width: min(520px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(11,43,65,.25); }
.dialog header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.dialog .body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.dialog footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.res { display: flex; flex-direction: column; gap: 2px; }
.res .lbl { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
.res button { border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 8px; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.res button:hover, .res button[aria-pressed="true"] { background: var(--selected); }
.res .ava { width: 30px; height: 30px; font-size: 11px; }
.selected { display: flex; flex-wrap: wrap; gap: 6px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field input { border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 8px 10px; }

/* mobile screen: three real phone-width frames of the same components */
.phones { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.phone { width: 375px; max-width: 100%; height: 720px; border: 8px solid #1D2937; border-radius: 32px; overflow: hidden; background: var(--white); display: flex; flex-direction: column; position: relative; }
.phone .cap { position: absolute; top: -28px; left: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.phone-wrap { position: relative; padding-top: 28px; max-width: 100%; }
.phone .center { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; min-height: 0; border: 0; border-radius: 0; }
.phone .center:not(:has(.top)) { grid-template-rows: minmax(0, 1fr); }
.phone .top { padding: 10px; gap: 8px; }
.phone .top h1 { font-size: 16px; }
.phone .top .sections { order: 3; width: 100%; }
.phone .side { grid-row: 2; }
.phone .back { display: inline-flex; }
.phone .side { border-right: 0; }
.phone .conv-head { padding: 8px 10px; }
.phone .msg { max-width: 92%; }
.phone .btn.wide-only { display: none; }
.phone .compose { position: sticky; bottom: 0; }
.legend { max-width: 760px; color: var(--muted); font-size: 13px; }

@media (max-width: 600px) {
  .notif-row { grid-template-columns: 10px 34px minmax(0, 1fr); }
  .notif-row .rt { grid-column: 3; justify-content: flex-start; }
  .ntools .btn, .notif-row .btn { white-space: normal; text-align: left; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .menu { display: none; }
  .center { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: calc(100vh - 120px); min-height: 520px; }
  .center:not(:has(.top:not(.hide-narrow))) { grid-template-rows: minmax(0, 1fr); }
  .center .side.hide-narrow, .center .conv.hide-narrow, .center .top.hide-narrow { display: none; }
  .top .sections { order: 3; width: 100%; }
  .back { display: inline-flex; }
}
</style>

<div class="proto" role="region" aria-label="Панель прототипа">
  <b class="tag">ПРОТОТИП</b>
  <span class="note">Синтетические данные. Не подключён к BMS24 и реальным сообщениям.</span>
  <span class="seg" role="group" aria-label="Экран">
    <button data-screen="A" aria-pressed="true">А. Разговор</button>
    <button data-screen="B" aria-pressed="false">Б. Обсуждение задачи</button>

  // Optional review parameters: ?state=senderr|noaccess|long|...&drawer=1&future=1&expand=1 (prototype only).
  var qp = {}; try { location.search.slice(1).split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) qp[p[0]] = decodeURIComponent(p[1] || ''); }); } catch (e) {}
  if (qp.state) { state.mode = qp.state; state.sendError = qp.state === 'senderr'; document.getElementById('stateSel').value = qp.state; if (qp.state === 'nosearch') state.q = 'Иванов'; }
  if (qp.future === '1') { state.future = true; document.getElementById('futureChk').checked = true; }
  var start = location.hash.slice(1);
  setScreen(start.length === 1 && 'ABCDE'.indexOf(start) >= 0 ? start : 'A');
  if (qp.drawer === '1') { state.drawer = true; render(); }
  if (qp.expand === '1') { state.expanded = true; render(); }
  if (qp.reply) { state.reply = qp.reply; state.files = ['Цены_итог.xlsx', LONGNAME]; state.draft = 'Подтверждаю цены, @Анна Смирнова'; render(); }
})();
</script>
